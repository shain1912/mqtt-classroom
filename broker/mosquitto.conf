# Mosquitto config for the classroom broker (Eclipse Mosquitto 2.x on Windows).
#
# Mosquitto 2.x binds to localhost only unless a listener is declared, which is
# why the default install accepts no LAN clients. The two listeners below open
# the broker to the classroom network.
#
# NOTE: anonymous access is enabled. Anyone on the same network can publish and
# subscribe. Use only on a trusted classroom LAN, never on a public network.

# --- MQTT over TCP: ESP32 boards, mosquitto_pub/sub, desktop clients ---
listener 1883 0.0.0.0
protocol mqtt

# --- MQTT over WebSockets: browser clients (mqtt.js / Paho) ---
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true

# Keep retained messages and session state across broker restarts.
persistence true
persistence_location C:\Program Files\mosquitto\

# Log to the Windows event log (default for the service install).
log_dest eventlog
log_type error
log_type warning
log_type notice
log_type information

# Students share one broker; allow a reasonable number of concurrent clients.
max_connections -1
